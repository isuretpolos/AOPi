name: Build Desktop Zip

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 24
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "24"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build project
        run: ./gradlew clean lwjgl3:dist

      - name: Prepare desktop package
        shell: bash
        run: |
          rm -rf package build-package.zip
          mkdir -p package

          if [ -d lwjgl3/build/libs ]; then
            cp -r lwjgl3/build/libs package/libs
          fi

          if [ -d assets ]; then
            cp -r assets package/assets
          fi

          if [ -f README.md ]; then
            cp README.md package/
          fi

          if [ -f LICENSE ]; then
            cp LICENSE package/
          fi

          cat > package/run.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          JAR=$(find "$(dirname "$0")/libs" -maxdepth 1 -type f -name "*.jar" | head -n 1)

          if [ -z "${JAR:-}" ]; then
            echo "No jar found in ./libs"
            exit 1
          fi

          java -jar "$JAR"
          EOF

          chmod +x package/run.sh

          cat > package/run.bat <<'EOF'
          @echo off
          setlocal enabledelayedexpansion

          set "JAR="
          for %%f in ("%~dp0libs\*.jar") do (
              set "JAR=%%f"
              goto :found
          )

          echo No jar found in .\libs
          exit /b 1

          :found
          java -jar "%JAR%"
          EOF

      - name: Create zip
        shell: bash
        run: |
          cd package
          zip -r ../build-package.zip .

      - name: Upload zipped package
        uses: actions/upload-artifact@v4
        with:
          name: desktop-package
          path: build-package.zip
