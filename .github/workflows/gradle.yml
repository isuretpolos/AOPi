name: Build Desktop Zip

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 24
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "24"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build project
        run: ./gradlew clean build

      - name: Prepare package
        shell: bash
        run: |
          rm -rf package
          mkdir -p package

          cp lwjgl3/build/libs/*.jar package/

          if [ -d assets ]; then
            cp -r assets package/
          fi

          cat > package/run.sh <<'EOF'
          #!/usr/bin/env bash
          JAR=$(ls *.jar | head -n 1)
          java -jar "$JAR"
          EOF

          chmod +x package/run.sh

          cat > package/run.bat <<'EOF'
          @echo off
          for %%f in (*.jar) do (
              java -jar "%%f"
              goto :eof
          )
          EOF

      - name: Upload desktop package
        uses: actions/upload-artifact@v4
        with:
          name: desktop-package
          path: package
