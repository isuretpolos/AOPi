name: Gradle Build

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 24
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "24"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build project
        run: ./gradlew clean build

      - name: Prepare package
        shell: bash
        run: |
          mkdir -p package

          echo "Collecting build outputs..."

          find . -type f \( -name "*.jar" -o -name "*.war" -o -name "*.zip" -o -name "*.tar" -o -name "*.tar.gz" \) \
            ! -name "*-sources.jar" \
            ! -name "*-javadoc.jar" \
            ! -path "*/.gradle/*" \
            ! -path "*/wrapper/*" \
            -exec cp --parents {} package/ \;

          if [ -d lwjgl3/build/libs ]; then
            mkdir -p package/run
            cp -r lwjgl3/build/libs package/run/
          fi

          if [ -d core/build/libs ]; then
            mkdir -p package/run
            cp -r core/build/libs package/run/
          fi

          if [ -d assets ]; then
            cp -r assets package/
          fi

          if [ -f README.md ]; then
            cp README.md package/
          fi

          if [ -f LICENSE ]; then
            cp LICENSE package/
          fi

      - name: Create zip
        shell: bash
        run: |
          cd package
          zip -r ../build-package.zip .

      - name: Upload zipped package
        uses: actions/upload-artifact@v4
        with:
          name: build-package
          path: build-package.zip
